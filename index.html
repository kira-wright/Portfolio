<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Game Show Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0c10;
    --panel:#14171d;
    --panel-2:#1b1f27;
    --line:rgba(255,255,255,0.08);
    --ink:#f2f4f6;
    --ink-dim:#808893;
    --c1:#e8b23d;
    --c2:#3da0e8;
    --c3:#e8437b;
    --danger:#e85555;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overflow:hidden; user-select:none;
  }
  .display-font{ font-family:'Oswald',sans-serif; }
  #app{ position:fixed; inset:0; padding-bottom:env(safe-area-inset-bottom); }
  .screen{ position:absolute; inset:0; display:none; }
  .screen.active{ display:flex; }

  /* ---------- Role picker ---------- */
  #screen-role{
    flex-direction:column; align-items:center; justify-content:center;
    gap:28px; padding:24px; text-align:center;
  }
  #screen-role .kicker{ color:var(--ink-dim); letter-spacing:.18em; font-size:12px; text-transform:uppercase; }
  #screen-role h1{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:28px; margin:0 0 6px;
    letter-spacing:.02em; text-transform:uppercase;
  }
  .role-grid{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width:520px; }
  .role-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    width:150px; height:110px; border-radius:14px; border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:15px; gap:8px;
    cursor:pointer;
  }
  .role-btn .dot{ width:22px; height:22px; border-radius:50%; }
  .role-btn.scorekeeper{ width:100%; max-width:520px; height:64px; flex-direction:row; }

  /* ---------- Display (per contestant iPad) ---------- */
  #screen-display{
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  #d-name{
    font-family:'Oswald',sans-serif; font-weight:500; letter-spacing:.24em;
    text-transform:uppercase; font-size:clamp(20px,3.4vw,36px); color:rgba(255,255,255,0.75);
    margin-bottom:0.5vh; text-shadow:0 2px 12px rgba(0,0,0,0.25);
  }
  #d-score{
    font-family:'Oswald',sans-serif; font-weight:700; color:#ffffff;
    line-height:0.95; white-space:nowrap;
    font-variant-numeric:tabular-nums; letter-spacing:.01em;
    transition:transform .18s ease;
  }
  #d-score.pulse{ transform:scale(1.05); }
  #d-connecting{ color:rgba(255,255,255,0.75); font-size:14px; margin-top:18px; letter-spacing:.08em; text-transform:uppercase; }

  .corner-tap{
    position:absolute; top:0; right:0; width:56px; height:56px;
    display:flex; align-items:flex-start; justify-content:flex-end;
    padding:14px; color:rgba(255,255,255,0.18); font-size:20px; cursor:pointer;
  }

  /* ---------- Controller (scorekeeper phone) ---------- */
  #screen-controller{
    flex-direction:column; height:100%; width:100%;
    padding:16px 16px 24px; gap:12px; overflow-y:auto;
  }
  #ctl-header{ display:flex; align-items:center; justify-content:space-between; padding:4px 4px 0; }
  #ctl-header .kicker{ color:var(--ink-dim); letter-spacing:.18em; font-size:11px; text-transform:uppercase; }
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; display:flex; flex-direction:column; gap:10px; flex-shrink:0;
  }
  .panel-top{ display:flex; align-items:center; gap:10px; }
  .swatch{ width:20px; height:20px; border-radius:50%; flex-shrink:0; border:1px solid rgba(255,255,255,0.25); }
  .name-input{
    flex:1; background:transparent; border:none; color:var(--ink); font-size:15px;
    font-family:inherit; font-weight:600; padding:4px 0; min-width:0;
  }
  .hex-input{
    width:78px; background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    color:var(--ink-dim); font-size:12px; padding:6px 8px; font-family:monospace; text-align:center;
  }
  .score-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .score-num{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:44px;
    font-variant-numeric:tabular-nums; min-width:90px;
  }
  .btn-row{ display:flex; gap:8px; }
  .step-btn{
    width:52px; height:52px; border-radius:12px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); font-size:24px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .step-btn:active{ transform:scale(0.94); }
  .custom-row{ display:flex; gap:8px; align-items:center; }
  .custom-input{
    flex:1; background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font-size:16px; padding:10px 12px; font-family:inherit;
    font-variant-numeric:tabular-nums;
  }
  .custom-add-btn{
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px;
    color:var(--ink); font-size:14px; font-weight:600; padding:10px 16px; cursor:pointer;
    letter-spacing:.02em; white-space:nowrap;
  }
  .custom-add-btn:active{ transform:scale(0.96); }
  #reset-all{
    margin-top:4px; background:transparent; border:1px solid rgba(232,85,85,0.4);
    color:var(--danger); border-radius:12px; padding:12px; font-size:14px;
    letter-spacing:.04em; text-transform:uppercase; cursor:pointer;
  }
  .role-change{
    text-align:center; color:var(--ink-dim); font-size:12px; padding:6px; cursor:pointer;
  }
</style>
</head>
<body>

<div id="app">

  <!-- ROLE PICKER -->
  <div id="screen-role" class="screen active">
    <div>
      <div class="kicker">Game Show Counter</div>
      <h1>Choose this device's role</h1>
    </div>
    <div class="role-grid">
      <div class="role-btn" data-role="1"><div class="dot" style="background:var(--c1)"></div>Contestant 1</div>
      <div class="role-btn" data-role="2"><div class="dot" style="background:var(--c2)"></div>Contestant 2</div>
      <div class="role-btn" data-role="3"><div class="dot" style="background:var(--c3)"></div>Contestant 3</div>
      <div class="role-btn scorekeeper" data-role="scorekeeper">Scorekeeper (this phone)</div>
    </div>
  </div>

  <!-- CONTESTANT DISPLAY -->
  <div id="screen-display" class="screen">
    <div id="d-name" class="display-font">Contestant</div>
    <div id="d-score" class="display-font">0</div>
    <div id="d-connecting">Connecting…</div>
    <div class="corner-tap" id="d-corner">⋯</div>
  </div>

  <!-- SCOREKEEPER CONTROLLER -->
  <div id="screen-controller" class="screen">
    <div id="ctl-header">
      <div class="kicker">Scorekeeper</div>
      <div class="role-change" id="ctl-role-change">change role</div>
    </div>
    <div id="ctl-panels"></div>
    <button id="reset-all">Reset all scores to 0</button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* =========================================================
   1) PASTE YOUR FIREBASE CONFIG HERE
   (Project Settings > General > Your apps > Web app > Config)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyA0b8m63LkH5E6fAWReWI5W4Msm0Qlrihw",
  authDomain: "game-show-score.firebaseapp.com",
  databaseURL: "https://game-show-score-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "game-show-score",
  storageBucket: "game-show-score.firebasestorage.app",
  messagingSenderId: "245531364126",
  appId: "1:245531364126:web:e8c4116d6344e470c8d70f",
  measurementId: "G-RKX036XB1N"
};

const DEFAULTS = {
  "1": { name: "Contestant 1", score: 0, color: "#e8b23d" },
  "2": { name: "Contestant 2", score: 0, color: "#3da0e8" },
  "3": { name: "Contestant 3", score: 0, color: "#e8437b" }
};

let db, lastScores = {};

function el(id){ return document.getElementById(id); }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  el(id).classList.add('active');
  if(id !== 'screen-display'){
    document.documentElement.style.background = '';
    document.body.style.background = '';
  }
}

function getForcedRole(){
  const p = new URLSearchParams(location.search);
  const mode = p.get('mode');
  if(mode === 'controller') return 'scorekeeper';
  if(mode === 'display' && p.get('id')) return p.get('id');
  return null;
}

function getRole(){
  return getForcedRole() || localStorage.getItem('gsRole');
}

function setRole(role){
  localStorage.setItem('gsRole', role);
  boot();
}

function clearRole(){
  if(confirm('Change this device\'s role?')){
    localStorage.removeItem('gsRole');
    boot();
  }
}

/* ---------- Firebase init ---------- */
function initFirebase(){
  if (firebase.apps.length) return;
  firebase.initializeApp(firebaseConfig);
}

function withAuth(cb){
  initFirebase();
  db = firebase.database();
  firebase.auth().onAuthStateChanged(user=>{
    if(user){ cb(); }
  });
  firebase.auth().signInAnonymously().catch(err=>{
    console.error(err);
    const msg = 'Could not connect: ' + err.message;
    const connectingEl = document.getElementById('d-connecting');
    if(connectingEl) connectingEl.textContent = msg;
    alert(msg + '\n\nCheck that your firebaseConfig is filled in and Anonymous auth is enabled.');
  });
}

function contestantRef(id){
  return db.ref('rooms/default/contestants/' + id);
}

/* ---------- Display screen ---------- */
function startDisplay(id){
  showScreen('screen-display');
  el('d-corner').onclick = clearRole;
  const ref = contestantRef(id);

  const timeoutId = setTimeout(()=>{
    el('d-connecting').textContent = 'Still connecting… check wifi, or tap the corner ⋯ to switch roles and try again.';
  }, 7000);

  // ensure defaults exist without clobbering existing data
  ref.once('value').then(snap=>{
    if(!snap.exists()) ref.set(DEFAULTS[id]);
  }).catch(err=>{
    el('d-connecting').textContent = 'Error: ' + err.message;
  });

  ref.on('value', snap=>{
    clearTimeout(timeoutId);
    const data = snap.val() || DEFAULTS[id];
    el('d-connecting').style.display = 'none';
    el('d-name').textContent = data.name || ('Contestant ' + id);
    const color = data.color || DEFAULTS[id].color;
    el('screen-display').style.background = color;
    document.documentElement.style.background = color;
    document.body.style.background = color;
    const scoreEl = el('d-score');

    const newScore = (typeof data.score === 'number') ? data.score : 0;
    if(lastScores[id] !== undefined && lastScores[id] !== newScore){
      scoreEl.classList.add('pulse');
      setTimeout(()=>scoreEl.classList.remove('pulse'), 180);
    }
    lastScores[id] = newScore;
    scoreEl.textContent = newScore;
    fitScoreFont(scoreEl, String(newScore));
  }, err=>{
    clearTimeout(timeoutId);
    el('d-connecting').style.display = 'block';
    el('d-connecting').textContent = 'Error: ' + err.message;
  });
}

/* ---------- Controller screen ---------- */
function startController(){
  showScreen('screen-controller');
  el('ctl-role-change').onclick = clearRole;
  el('reset-all').onclick = ()=>{
    if(confirm('Reset all three scores to 0?')){
      ['1','2','3'].forEach(id=> contestantRef(id).child('score').set(0));
    }
  };

  const panels = el('ctl-panels');
  panels.innerHTML = '';

  ['1','2','3'].forEach(id=>{
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.innerHTML = `
      <div class="panel-top">
        <div class="swatch" id="ctl-swatch-${id}"></div>
        <input class="name-input" id="ctl-name-${id}" maxlength="20">
        <input class="hex-input" id="ctl-hex-${id}" maxlength="7" spellcheck="false">
      </div>
      <div class="score-row">
        <div class="score-num display-font" id="ctl-score-${id}">0</div>
        <div class="btn-row">
          <div class="step-btn" data-id="${id}" data-delta="-1">−</div>
          <div class="step-btn" data-id="${id}" data-delta="1">+</div>
        </div>
      </div>
      <div class="custom-row">
        <input class="custom-input" id="ctl-custom-${id}" type="number" inputmode="numeric" placeholder="Add points, e.g. 5 or -5">
        <div class="custom-add-btn" data-id="${id}">Add</div>
      </div>
    `;
    panels.appendChild(panel);

    const ref = contestantRef(id);
    ref.once('value').then(snap=>{
      if(!snap.exists()) ref.set(DEFAULTS[id]);
    });

    ref.on('value', snap=>{
      const data = snap.val() || DEFAULTS[id];
      const nameInput = el('ctl-name-' + id);
      const hexInput = el('ctl-hex-' + id);
      // don't stomp on text the user is actively typing
      if(document.activeElement !== nameInput) nameInput.value = data.name || '';
      if(document.activeElement !== hexInput) hexInput.value = data.color || DEFAULTS[id].color;
      el('ctl-swatch-' + id).style.background = data.color || DEFAULTS[id].color;
      el('ctl-score-' + id).textContent = (typeof data.score === 'number') ? data.score : 0;
    });

    el('ctl-name-' + id).addEventListener('change', e=>{
      ref.child('name').set(e.target.value || DEFAULTS[id].name);
    });

    el('ctl-hex-' + id).addEventListener('change', e=>{
      let v = e.target.value.trim();
      if(!v.startsWith('#')) v = '#' + v;
      if(!/^#[0-9A-Fa-f]{6}$/.test(v)){
        alert('Enter a 6-digit hex code, like #E8437B');
        e.target.value = lastKnownHex(id);
        return;
      }
      ref.child('color').set(v);
    });
  });

  panels.querySelectorAll('.step-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.id;
      const delta = parseInt(btn.dataset.delta, 10);
      contestantRef(id).child('score').transaction(cur => (cur || 0) + delta);
    });
  });

  function applyCustomAmount(id){
    const input = el('ctl-custom-' + id);
    const val = parseInt(input.value, 10);
    if(isNaN(val)) return;
    contestantRef(id).child('score').transaction(cur => (cur || 0) + val);
    input.value = '';
  }

  panels.querySelectorAll('.custom-add-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> applyCustomAmount(btn.dataset.id));
  });

  ['1','2','3'].forEach(id=>{
    el('ctl-custom-' + id).addEventListener('keydown', e=>{
      if(e.key === 'Enter') applyCustomAmount(id);
    });
  });
}

function lastKnownHex(id){ return DEFAULTS[id].color; }

function fitScoreFont(scoreEl, text){
  const digits = Math.max(text.length, 1);
  const byHeight = window.innerHeight * 0.60;
  const byWidth = (window.innerWidth * 0.88) / (digits * 0.64);
  const size = Math.min(byHeight, byWidth);
  scoreEl.style.fontSize = size + 'px';
}
window.addEventListener('resize', ()=>{
  const scoreEl = document.getElementById('d-score');
  if(scoreEl && scoreEl.textContent) fitScoreFont(scoreEl, scoreEl.textContent);
});

/* ---------- Role picker wiring ---------- */
document.querySelectorAll('.role-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> setRole(btn.dataset.role));
});

/* ---------- Boot ---------- */
function boot(){
  const role = getRole();
  if(!role){
    showScreen('screen-role');
    return;
  }
  withAuth(()=>{
    if(role === 'scorekeeper') startController();
    else startDisplay(role);
  });
}

boot();
</script>
</body>
</html>
